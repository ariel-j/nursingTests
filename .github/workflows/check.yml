# Safety net: the admin panel commits straight to main from the browser, so every push is re-checked
# here with the same commands used locally. Read-only token, no secrets, no PR-target triggers.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
