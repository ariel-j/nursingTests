# Rebuilds media/manifest.json after files are uploaded to media/ (GitHub Pages can't list a
# folder, so the media page reads this list). Commits only when the list changed.
name: Media manifest

on:
  push:
    branches: [main]
    paths: ['media/**', '!media/manifest.json', 'quizzes/subjects.json']
  workflow_dispatch:

permissions:
  contents: write
  pages: write # to rebuild the site: a push made by this job doesn't start a Pages build reliably

concurrency:
  group: media-manifest
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build media/manifest.json
        id: build
        continue-on-error: true
        run: node scripts/media-manifest.mjs
      - name: Commit if changed
        run: |
          git add media/manifest.json
          if git diff --cached --quiet; then
            echo "media/manifest.json is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update media/manifest.json"
          git pull --rebase origin main # another upload may have landed meanwhile
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        id: commit
      - name: Rebuild the Pages site
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
      - name: Fail on rejected files
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Some files in media/ were left out, see the 'Build media/manifest.json' step."
          exit 1
