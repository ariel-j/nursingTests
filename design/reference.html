<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מבחן: המערכת האנדוקרינית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EFF4;--surface:#FFFFFF;--ink:#1E1B2B;--muted:#5E5A6E;--line:#DAD5E1;
  --accent:#6B2F63;--accent-soft:#F1E4EF;--loop:#2E6E6A;--loop-track:#D9E6E4;
  --ok:#1F7A4D;--ok-soft:#E3F3EA;--bad:#B3261E;--bad-soft:#FBE7E5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16141C;--surface:#211E29;--ink:#EDEAF3;--muted:#A7A2B5;--line:#38334A;
  --accent:#D48CC6;--accent-soft:#3A2536;--loop:#6FC2BB;--loop-track:#253836;
  --ok:#5FC98F;--ok-soft:#173226;--bad:#F08A80;--bad-soft:#3B1D1B;}}
:root[data-theme="dark"]{
  --bg:#16141C;--surface:#211E29;--ink:#EDEAF3;--muted:#A7A2B5;--line:#38334A;
  --accent:#D48CC6;--accent-soft:#3A2536;--loop:#6FC2BB;--loop-track:#253836;
  --ok:#5FC98F;--ok-soft:#173226;--bad:#F08A80;--bad-soft:#3B1D1B;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ring{flex:none;width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .num b{font-size:22px;font-weight:600}
.ring .num span{font-size:12px;color:var(--muted)}
.hstats h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:24px;margin:0 0 4px;font-weight:700}
.hstats p{margin:0;color:var(--muted);font-size:15px}
.hstats strong{color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.topic{display:inline-block;font-size:13px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.again{font-size:13px;color:var(--muted);margin-inline-start:8px}
.qtext{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:22px;line-height:1.5;margin:0 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,.chk:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .l{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .l{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-soft);color:var(--ok);font-weight:600}
.fb.wrong{background:var(--bad-soft)}
.fb.wrong h3{margin:0 0 6px;color:var(--bad);font-size:16px}
.fb.wrong p{margin:0;color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:18px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 20px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.topics{display:grid;gap:8px;margin:14px 0 18px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.chk .c{margin-inline-start:auto;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:22px;margin:0 0 8px}
.big{font-size:44px;font-weight:600;color:var(--loop);line-height:1}
.list{margin:8px 0 0;padding:0;list-style:none}
.list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.list li:last-child{border-bottom:0}
.list .n{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--loop-track);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--bad)}
.section{margin-top:22px}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ring circle.p{transition:stroke-dashoffset .5s ease}}
@media (max-width:480px){.qtext{font-size:20px}.hstats h1{font-size:20px}.ring{width:70px;height:70px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const QS = [{"id": 0, "t": "עקרונות כלליים", "q": "מה ההבדל העיקרי בין אופן ההעברה של שליח כימי במערכת האנדוקרינית לבין זה שבמערכת העצבים?", "o": ["הורמונים עוברים בדם למרחק רב, נוירוטרנסמיטורים חוצים סינפסה קצרה", "שתי המערכות מעבירות את השליחים בדם, אך כל אחת בקצב אחר", "הורמונים חוצים סינפסה קצרה, נוירוטרנסמיטורים עוברים בדם למרחק רב", "שתי המערכות מעבירות את השליחים בסינפסות, אך למרחק שונה"], "c": 0, "e": "במערכת האנדוקרינית ההורמון מופרש לדם ומגיע לתאים רחוקים. במערכת העצבים הנוירוטרנסמיטור עובר רק את המרווח המיקרוסקופי של הסינפסה. זה גם מה שמסביר את ההבדל במהירות ובמשך התגובה."}, {"id": 1, "t": "עקרונות כלליים", "q": "באיזה מקרה צפוי שהתגובה לגירוי תופיע לאט ותימשך זמן רב?", "o": ["כשהתגובה מתווכת על ידי הורמון שהופרש לדם", "כשהתגובה מתווכת על ידי רפלקס בחוט השדרה", "כשהתגובה מתווכת על ידי נוירוטרנסמיטור בסינפסה", "כשהתגובה מתווכת על ידי עצב מוטורי לשריר שלד"], "c": 0, "e": "תגובה הורמונלית מופיעה לאט ונמשכת זמן רב, כי ההורמון צריך לעבור בדם ולהפעיל תהליכים בתא. כל שאר האפשרויות הן תגובות עצביות, שמופיעות מהר ונמשכות זמן קצר."}, {"id": 2, "t": "עקרונות כלליים", "q": "הורמון מסוים מופרש לדם ומגיע לכל רקמות הגוף, אבל משפיע רק על הכבד. מה ההסבר?", "o": ["הכבד הוא האיבר היחיד שסופג הורמונים מהדם", "רק לתאי הכבד יש קולטן מתאים להורמון", "ההורמון מתפרק לפני שהוא מגיע לשאר הרקמות", "זרימת הדם לכבד גדולה מזו של שאר האיברים"], "c": 1, "e": "הורמון משפיע רק על תאי מטרה, כלומר תאים שיש להם קולטן שמתאים לו. ההורמון מגיע לכל מקום בדם, אבל תא בלי קולטן פשוט לא 'שומע' אותו."}, {"id": 3, "t": "עקרונות כלליים", "q": "מהו 'איבר מטרה' של הורמון?", "o": ["איבר שתאיו נושאים קולטן להורמון ומגיבים לו", "איבר שמפרק את ההורמון ומסלק אותו מהגוף", "איבר שאוגר את ההורמון עד שהוא משתחרר לדם", "איבר שמייצר את ההורמון ומפריש אותו אל הדם"], "c": 0, "e": "איבר מטרה הוא האיבר שההורמון פועל עליו, בזכות קולטנים מתאימים בתאיו. האיבר שמייצר את ההורמון הוא הבלוטה, לא איבר המטרה."}, {"id": 4, "t": "עקרונות כלליים", "q": "הלבלב מפריש גם מיצי עיכול וגם אינסולין. מה ההבדל בין שתי ההפרשות?", "o": ["מיצי העיכול מופרשים לדם, והאינסולין מופרש לתריסריון", "מיצי העיכול מופרשים לתריסריון, והאינסולין מופרש לדם", "שניהם מופרשים לתריסריון, אך מתאים שונים בלבלב", "שניהם מופרשים לדם, אך בתגובה לגירויים שונים"], "c": 1, "e": "הפעילות האקסוקרינית של הלבלב שולחת מיצי עיכול דרך צינור לתריסריון. הפעילות האנדוקרינית (איי לנגרהנס) מפרישה הורמונים כמו אינסולין ישירות לזרם הדם."}, {"id": 5, "t": "עקרונות כלליים", "q": "איזה מהבאים אינו נמנה עם תפקידי המערכת האנדוקרינית שנלמדו?", "o": ["ויסות פעילות של שריר חלק ובלוטות", "השתתפות בהבשלת מערכת החיסון", "הולכת תחושת כאב מהעור אל המוח", "ויסות קצב המטבוליזם בתאי הגוף"], "c": 2, "e": "הולכת תחושה היא תפקיד של מערכת העצבים. המערכת האנדוקרינית מווסתת מטבוליזם, שריר חלק, לב ובלוטות, הומיאוסטזיס, מערכת החיסון, גדילה ורבייה."}, {"id": 6, "t": "עקרונות כלליים", "q": "מדוע ההיפותלמוס מתואר כנקודת המפגש בין מערכת העצבים למערכת האנדוקרינית?", "o": ["הוא חלק מהמוח, ובו בזמן מפריש הורמונים להיפופיזה", "הוא בלוטה היקפית שמקבלת עצבוב ישיר מחוט השדרה בלבד", "הוא חלק מההיפופיזה ומפריש את כל ההורמונים הטרופיים", "הוא מפריש נוירוטרנסמיטורים ישירות לכל בלוטות הגוף"], "c": 0, "e": "ההיפותלמוס הוא אזור במוח ששולט גם במערכת העצבים האוטונומית וגם במערכת האנדוקרינית, דרך הורמונים שהוא מפריש להיפופיזה. את ההורמונים הטרופיים מפרישה ההיפופיזה הקדמית, לא ההיפותלמוס."}, {"id": 7, "t": "עקרונות כלליים", "q": "מה נכון לגבי המושג 'הורמון'?", "o": ["מולקולה שעוברת רק בין תאים סמוכים בסינפסה", "מולקולה שמיוצרת בתא אחד ומעבירה מידע לתא אחר", "מולקולה שפועלת רק בתוך התא שבו היא נוצרה", "מולקולה שמיוצרת בכל תאי הגוף באותה כמות"], "c": 1, "e": "הורמון נוצר בתאי בלוטה, עובר בדם ופועל על תאים אחרים (תאי מטרה). מעבר בסינפסה מאפיין נוירוטרנסמיטור, לא הורמון."}, {"id": 8, "t": "עקרונות כלליים", "q": "איזה צמד מתאר נכון את המיקום של שתי בלוטות?", "o": ["האדרנל בתוך רקמת הלבלב, התימוס בצוואר מתחת ללוע", "האדרנל על הקוטב העליון של הכליה, התימוס מאחורי עצם החזה", "האדרנל בצוואר ליד קנה הנשימה, התימוס במרכז המוח", "האדרנל מאחורי עצם החזה, התימוס על הקוטב העליון של הכליה"], "c": 1, "e": "בלוטות האדרנל (יותרת הכליה) יושבות על המשטח העליון של כל כליה. התימוס נמצא בבית החזה, מתחת לעצם החזה ולפני כלי הדם הגדולים."}, {"id": 9, "t": "עקרונות כלליים", "q": "איזו בלוטה נמצאת בצוואר, משני צידי קנה הנשימה, ובנויה משתי אונות המחוברות בגשר צר?", "o": ["בלוטת התריס", "בלוטת התימוס", "בלוטת ההיפופיזה", "בלוטת יותרת התריס"], "c": 0, "e": "זו בלוטת התריס, בצורת פרפר, עם גשר (isthmus) בין שתי האונות. בלוטות יותרת התריס הן ארבע בלוטות קטנות שיושבות בצידי בלוטת התריס, לא הבלוטה עצמה."}, {"id": 10, "t": "עקרונות כלליים", "q": "פגיעה בבלוטה אנדוקרינית אחת גורמת לשינויים באיברים רבים ומרוחקים. מה מסביר את היקף ההשפעה?", "o": ["הבלוטה מחוברת בעצבים ישירים לכל אחד מהאיברים האלה", "ההורמון מגיע בדם לכל איבר שיש בו קולטן מתאים", "כל איבר בגוף מייצר עותק מקומי של אותו הורמון", "ההורמון עובר בדיפוזיה מתא לתא לאורך כל הגוף"], "c": 1, "e": "ההורמון מופרש לזרם הדם ומגיע לכל הגוף, ולכן כל איבר עם קולטנים מתאים יושפע. אין לבלוטה חיבור עצבי לכל איבר, ודיפוזיה מתא לתא איטית מדי למרחקים כאלה."}, {"id": 11, "t": "עקרונות כלליים", "q": "תגובת 'הילחם או ברח' מתחילה בתוך שניות, אבל חלק מהשפעותיה נמשכות זמן רב. מה מסביר את השילוב?", "o": ["מערכת העצבים לבדה אחראית גם לשלב המהיר וגם לשלב הממושך", "הורמונים לבדם אחראים גם לשלב המהיר וגם לשלב הממושך", "מערכת העצבים מגיבה מהר, והורמונים מאריכים ומעצימים את התגובה", "הורמונים מגיבים מהר, ומערכת העצבים מאריכה ומעצימה את התגובה"], "c": 2, "e": "העצבים הסימפתטיים מגיבים תוך שניות. במקביל לשד האדרנל מפריש אדרנלין לדם, ובהמשך מופעל ציר הקורטיזול. ההורמונים מעצימים ומאריכים את התגובה העצבית."}, {"id": 12, "t": "סטרואידים וקולטנים", "q": "ממה מיוצרים כל ההורמונים הסטרואידים, ומה ההשלכה של כך?", "o": ["מחומצות אמינו, ולכן הם מסיסים במים ונקשרים על הממברנה", "מכולסטרול, ולכן הם מסיסים במים ונקשרים על הממברנה", "מכולסטרול, ולכן הם מסיסים בשומן וחוצים את הממברנה", "מחומצות אמינו, ולכן הם מסיסים בשומן וחוצים את הממברנה"], "c": 2, "e": "כל הסטרואידים נבנים מכולסטרול, ולכן הם מסיסים בשומן ועוברים בקלות את ממברנת התא. הורמונים שנבנים מחומצות אמינו הם הלא-סטרואידים, והם מסיסים במים."}, {"id": 13, "t": "סטרואידים וקולטנים", "q": "היכן נמצא הקולטן של הורמון מסיס במים, ומדוע?", "o": ["בתוך הגרעין, כי ההורמון לא חוצה את ממברנת השומן", "על קרום התא, כי ההורמון מתפרק מיד בציטופלזמה", "בתוך הציטופלזמה, כי ההורמון חוצה את ממברנת השומן", "על קרום התא, כי ההורמון לא חוצה את ממברנת השומן"], "c": 3, "e": "ממברנת התא בנויה משומנים, והורמון מסיס במים לא עובר דרכה. לכן הקולטן שלו חייב להיות על פני הממברנה."}, {"id": 14, "t": "סטרואידים וקולטנים", "q": "איזה סוג הורמון נקשר לקולטן שעל קרום התא?", "o": ["הורמון סטרואידי, כמו אלדוסטרון", "הורמון סטרואידי, כמו קורטיזול", "הורמון מין, כמו טסטוסטרון", "הורמון חלבוני, כמו אינסולין"], "c": 3, "e": "אינסולין הוא הורמון חלבוני, מסיס במים, ולכן נקשר לקולטן בממברנה. קורטיזול, טסטוסטרון ואלדוסטרון הם סטרואידים שחוצים את הממברנה ונקשרים לקולטן בתוך התא."}, {"id": 15, "t": "סטרואידים וקולטנים", "q": "איזה מההורמונים הבאים הוא סטרואיד?", "o": ["גלוקגון", "אוקסיטוצין", "ADH", "אלדוסטרון"], "c": 3, "e": "אלדוסטרון מופרש מקליפת האדרנל ונבנה מכולסטרול, ולכן הוא סטרואיד. אוקסיטוצין, גלוקגון ו-ADH בנויים מחומצות אמינו ואינם סטרואידים."}, {"id": 16, "t": "סטרואידים וקולטנים", "q": "איזה מההורמונים הבאים אינו סטרואיד?", "o": ["טסטוסטרון", "פרוגסטרון", "אדרנלין", "קורטיזול"], "c": 2, "e": "אדרנלין הוא קטכולאמין שנגזר מחומצות אמינו (טירוזין ופנילאלנין), ולכן אינו סטרואיד. שאר ההורמונים נבנים מכולסטרול: קורטיזול מקליפת האדרנל, פרוגסטרון וטסטוסטרון מהגונדות."}, {"id": 17, "t": "סטרואידים וקולטנים", "q": "הורמון נקשר לקולטן בתוך התא, והקומפלקס נקשר ל-DNA. מה התוצאה?", "o": ["הפעלה מיידית של שליח שני בציטופלזמה", "שעתוק גן ויצירת חלבון חדש בתא", "פירוק ה-DNA והפסקת חלוקת התא", "פתיחה מיידית של תעלות יונים בממברנה"], "c": 1, "e": "כך פועל הורמון סטרואידי: הקומפלקס הורמון-קולטן נקשר ל-DNA, מתחיל שעתוק, ונוצר חלבון חדש (אנזים או תעלה). פתיחת תעלות ושליח שני הם מנגנונים של הורמונים לא-סטרואידים."}, {"id": 18, "t": "סטרואידים וקולטנים", "q": "חוקר מודד את תגובת תא המטרה להורמון, והתגובה מופיעה רק אחרי כמה שעות. איזה הורמון סביר שנבדק?", "o": ["אדרנלין", "קורטיזול", "אינסולין", "גלוקגון"], "c": 1, "e": "השפעה שמופיעה אחרי שעות מאפיינת הורמון סטרואידי, שפועל דרך יצירת חלבונים חדשים. קורטיזול הוא סטרואיד. אדרנלין, אינסולין וגלוקגון מסיסים במים ומשפיעים תוך דקות."}, {"id": 19, "t": "סטרואידים וקולטנים", "q": "מדוע ההשפעה של הורמון מסיס במים מופיעה בתוך דקות?", "o": ["הוא משנה פעילות של אנזימים ותעלות שכבר בתא", "הוא חוצה את הממברנה ונקשר לחלבון נשא בתוך התא", "הוא נכנס לגרעין ומפעיל גנים רדומים במהירות", "הוא מגרה את התא לייצר חלבונים חדשים במהירות"], "c": 0, "e": "הורמון מסיס במים לא מחכה ליצירת חלבון חדש. הוא מפעיל מסלול אותות שמשנה את פעילותם של אנזימים ותעלות שכבר נמצאים בתא, ולכן התגובה מהירה."}, {"id": 20, "t": "סטרואידים וקולטנים", "q": "במנגנון השליח השני (second messenger), מהו 'השליח הראשון'?", "o": ["מולקולה בתוך התא שנוצרת אחרי הקישור", "האנזים שמופעל בציטופלזמה בסוף התהליך", "ההורמון עצמו, שנקשר לקולטן בממברנה", "החלבון החדש שנוצר בתא בעקבות השעתוק"], "c": 2, "e": "השליח הראשון הוא ההורמון, שנשאר מחוץ לתא ונקשר לקולטן בממברנה. המולקולה שנוצרת בתוך התא בעקבות זאת היא השליח השני, והיא מעבירה את האות הלאה."}, {"id": 21, "t": "סטרואידים וקולטנים", "q": "באילו בלוטות מיוצרים ההורמונים הסטרואידים?", "o": ["בגונדות, בלשד האדרנל ובשליה", "בגונדות, בקליפת האדרנל ובשליה", "בהיפופיזה, בקליפת האדרנל ובלבלב", "בבלוטת התריס, בגונדות ובאיי לנגרהנס"], "c": 1, "e": "הסטרואידים מיוצרים בגונדות (אשכים ושחלות), בקליפת האדרנל ובשליה. לשד האדרנל מפריש אדרנלין ונוראדרנלין, שאינם סטרואידים."}, {"id": 22, "t": "סטרואידים וקולטנים", "q": "אילו מהורמוני ההיפופיזה הם סטרואידים?", "o": ["אף אחד מהם, הורמוני ההיפופיזה אינם סטרואידים", "ADH ואוקסיטוצין בלבד, כי הם נאגרים באונה האחורית", "FSH ו-LH בלבד, כי הם מווסתים הורמוני מין", "ACTH ו-TSH בלבד, כי הם הורמונים טרופיים"], "c": 0, "e": "כל הורמוני ההיפופיזה, בשתי האונות, אינם סטרואידים. FSH ו-LH מגרים הפרשה של הורמוני מין סטרואידים, אבל הם עצמם אינם סטרואידים."}, {"id": 23, "t": "סטרואידים וקולטנים", "q": "תרופה חוסמת את יצירת החלבונים החדשים בתא. ע }, {"id": 28, "t": "מנגנוני משוב", "q": "מהו משוב שלילי במערכת הורמונלית?", "o": ["ריכוז ההורמון אינו משפיע על המשך הפרשתו", "ירידה בריכוז ההורמון מעכבת את המשך הפרשתו", "עלייה בריכוז ההורמון מעכבת את המשך הפרשתו", "עלייה בריכוז ההורמון מגבירה את המשך הפרשתו"], "c": 2, "e": "במשוב שלילי התוצאה 'מכבה' את הגורם: כשריכוז ההורמון עולה ההפרשה נבלמת, וכשהוא יורד ההפרשה גוברת. עלייה שמגבירה הפרשה היא משוב חיובי."}, {"id": 29, "t": "מנגנוני משוב", "q": "רמת הסידן בדם יורדת. איזה רצף מתאר נכון את המשוב?", "o": ["הפרשת PTH יורדת, הסידן עולה, והפרשת PTH מתחדשת", "הפרשת PTH עולה, הסידן עולה, והפרשת PTH ממשיכה לעלות", "הפרשת PTH עולה, הסידן עולה, והפרשת PTH נבלמת", "הפרשת קלציטונין עולה, הסידן עולה, והפרשתו נבלמת"], "c": 2, "e": "זו הדוגמה הקלאסית למשוב שלילי: סידן נמוך מגרה הפרשת PTH, ה-PTH מעלה את הסידן, והסידן שחזר לתקין מפסיק את ההפרשה. קלציטונין מופרש כשהסידן גבוה ומוריד אותו."}, {"id": 30, "t": "מנגנוני משוב", "q": "מדוע משוב שלילי נחשב למנגנון העיקרי לשמירת הומיאוסטזיס?", "o": ["הוא מפסיק את הפרשת ההורמון לצמיתות אחרי שימוש", "הוא מחזיר את המשתנה לטווח התקין אחרי סטייה", "הוא פועל פעם אחת, בזמן ההתפתחות של העובר", "הוא מגביר את הסטייה עד שהתהליך כולו מסתיים"], "c": 1, "e": "משוב שלילי מעורר 'תגובה הפוכה' לשינוי, ולכן מחזיר את התנאים לקדמותם. הוא פועל ברציפות, במעגל ללא התחלה וסוף. הגברת הסטייה מאפיינת משוב חיובי."}, {"id": 31, "t": "מנגנוני משוב", "q": "בזמן לידה, התכווצויות הרחם מגבירות הפרשת אוקסיטוצין, וזה מגביר את ההתכווצויות. מה סוג המנגנון?", "o": ["משוב שלילי, שמחזיר את הרחם למצב של מנוחה", "משוב חיובי, שמגביר את התהליך עד שהוא מסתיים", "משוב שלילי, שמגביר את ההתכווצויות בהדרגה", "משוב חיובי, ששומר על התכווצויות בעוצמה קבועה"], "c": 1, "e": "התוצאה (התכווצויות) מגבירה את הגורם (אוקסיטוצין), והתהליך מתעצם עד שהלידה מסתיימת. במשוב חיובי אין חזרה לאיזון ואין עוצמה קבועה."}, {"id": 32, "t": "מנגנוני משוב", "q": "מה מאפיין תהליך של משוב חיובי?", "o": ["הוא המנגנון שמווסת את רוב ההורמונים בגוף", "הוא מופעל רק כשריכוז ההורמון יורד מתחת לסף", "יש לו התחלה וסיום, ואין בו חזרה לאיזון", "אין לו התחלה וסוף, והוא שומר על איזון מתמשך בגוף"], "c": 2, "e": "משוב חיובי מתחיל כשהשינוי עובר סף, מגביר את עצמו ומסתיים באירוע מוגדר (למשל הלידה). 'אין התחלה וסוף' מתאר משוב שלילי, והוא גם המנגנון שמווסת את רוב ההורמונים."}, {"id": 33, "t": "מנגנוני משוב", "q": "רמת T3/T4 בדם עולה מאוד. מה צפוי לקרות להפרשת TSH מההיפופיזה?", "o": ["היא תרד, בגלל משוב שלילי על ההיפופיזה", "היא תעלה, בגלל משוב חיובי על ההיפופיזה", "היא לא תשתנה, כי TSH אינו תלוי ב-T3/T4", "היא תרד, בגלל משוב חיובי על ההיפותלמוס"], "c": 0, "e": "הורמוני התריס מעכבים את ההיפופיזה ואת ההיפותלמוס במשוב שלילי. לכן כש-T3/T4 גבוהים, TSH יורד. זה בדיוק מה שרואים ביתר פעילות של בלוטת התריס."}, {"id": 34, "t": "מנגנוני משוב", "q": "מטופל נוטל במשך חודשים מינון גבוה של קורטיזול כתרופה. מה צפוי לקרות להפרשת ACTH שלו?", "o": ["היא תוגבר, כי קורטיזול מגרה את ההיפופיזה", "היא תוגבר, כדי לפצות על הקורטיזול החיצוני", "היא לא תשתנה, כי ACTH תלוי רק בדחק", "היא תדוכא, כי הקורטיזול בדם מעכב את הציר"], "c": 3, "e": "קורטיזול מעכב את ההיפותלמוס ואת ההיפופיזה במשוב שלילי. הגוף 'רואה' הרבה קורטיזול בדם, גם אם הוא מתרופה, ולכן מוריד את הפרשת ה-ACTH."}, {"id": 35, "t": "מנגנוני משוב", "q": "ברוב המקרים, איך מווסתת הפרשת ההורמונים בגוף?", "o": ["במשוב שלילי", "בקצב קבוע ללא משוב", "בגירוי עצבי בלבד", "במשוב חיובי"], "c": 0, "e": "הפרשת ההורמונים מווסתת לרוב במשוב שלילי, ששומר על הומיאוסטזיס. משוב חיובי הוא המקרה החריג (למשל אוקסיטוצין בלידה)."}, {"id": 36, "t": "מנגנוני משוב", "q": "אחרי ארוחה הגלוקוז עולה, אינסולין מופרש והגלוקוז יורד. מה יקרה להפרשת האינסולין כשהגלוקוז יחזור לתקין?", "o": ["היא תיפסק, ובמקומה יופרש סומטוסטטין", "היא תישאר גבוהה עד הארוחה הבאה", "היא תגבר, כדי להמשיך להוריד את הגלוקוז", "היא תפחת, כי הגירוי להפרשה נעלם"], "c": 3, "e": "זהו משוב שלילי: הגלוקוז הגבוה הוא שגרם להפרשה, וכשהוא חוזר לתקין ההפרשה פוחתת. אילו ההפרשה הייתה ממשיכה, הגלוקוז היה יורד מתחת לתקין."}, {"id": 37, "t": "מנגנוני משוב", "q": "בציר היפותלמוס, היפופיזה ובלוטת מטרה, מה תפקיד ההורמון של בלוטת המטרה בוויסות הציר?", "o": ["הוא אינו משפיע על הדרגות שמעליו בציר", "הוא מעכב רק את בלוטת המטרה עצמה", "הוא מעכב את ההיפותלמוס ואת ההיפופיזה", "הוא מגרה את ההיפותלמוס ואת ההיפופיזה"], "c": 2, "e": "ההורמון הסופי (למשל קורטיזול או T4) חוזר במשוב שלילי ומעכב את הדרגות שמעליו. כך הציר מווסת את עצמו ולא 'בורח'."}, {"id": 38, "t": "מנגנוני משוב", "q": "מה יקרה אם המשוב השלילי על הפרשת PTH ייפגע, כך שהבלוטה לא תזהה שהסידן כבר גבוה?", "o": ["PTH ימשיך להיות מופרש, והסידן בדם יעלה מעבר לתקין", "הסידן בדם יישאר תקין, כי העצמות יאזנו אותו", "הקלציטונין יפסיק להיות מופרש, והסידן יישאר תקין", "PTH יפסיק להיות מופרש, והסידן בדם ירד מתחת לתקין"], "c": 0, "e": "בלי משוב, שום דבר לא 'מכבה' את הבלוטה, ולכן PTH ממשיך להיות מופרש והסידן ממשיך לעלות (היפרקלצמיה). כך נראית יתר פעילות של יותרת התריס."}, {"id": 39, "t": "מנגנוני משוב", "q": "איזה מהמצבים הבאים הוא דוגמה למשוב חיובי?", "o": ["הפרשת אינסולין אחרי ארוחה", "הפרשת PTH כשהסידן בדם יורד", "הפרשת TSH כשיש חוסר ב-T3/T4", "הפרשת אוקסיטוצין בזמן הלידה"], "c": 3, "e": "באוקסיטוצין בלידה התוצאה מגבירה את הגורם, וזה משוב חיובי. בשאר הדוגמאות ההורמון מתקן את הסטייה, ואחרי התיקון ההפרשה נבלמת, כלומר משוב שלילי."}, {"id": 40, "t": "מנגנוני משוב", "q": "מדוע במשוב חיובי חייב להיות אירוע שמסיים את התהליך?", "o": ["כי המנגנון מתפרק מעצמו אחרי כמה דקות של פעילות", "כי המנגנון מגביר את עצמו ואינו חוזר לאיזון", "כי המנגנון פועל רק כשיש בדם הורמון נוסף", "כי ההורמון מאבד בהדרגה את הקולטנים שלו"], "c": 1, "e": "במשוב חיובי כל עלייה מביאה לעלייה נוספת, ואין 'בלם' פנימי. התהליך נעצר רק כשהגורם עצמו נעלם, למשל יציאת התינוק בסוף הלידה."}, {"id": 41, "t": "מנגנוני משוב", "q": "בבדיקת דם: הורמון של בלוטת מטרה גבוה, וההורמון הטרופי שמעליו נמוך. מה ההסבר הסביר?", "o": ["הבלוטה פגועה, וההיפופיזה מנסה לפצות בהפרשה מוגברת", "ההיפופיזה מפרישה ביתר, והמשוב החיובי מגביר את הבלוטה", "הבלוטה מפרישה ביתר, והמשוב השלילי מדכא את ההורמון הטרופי", "ההיפותלמוס פגוע, ולכן כל ההורמונים בציר נמוכים"], "c": 2, "e": "כשהבלוטה עצמה מפרישה ביתר, ההורמון שלה מעכב את ההיפופיזה, ולכן ההורמון הטרופי יורד (כמו T3/T4 גבוהים ו-TSH נמוך). אילו הבעיה הייתה בהיפופיזה, שני ההורמונים היו גבוהים."}, {"id": 42, "t": "היפותלמוס ומערכת השוער", "q": "מאיפה מופרש GHRH?", "o": ["מההיפותלמוס", "מההיפופיזה האחורית", "מההיפופיזה הקדמית", "מבלוטת התריס"], "c": 0, "e": "GHRH הוא הורמון משחרר, וכל ההורמונים המשחררים מופרשים מההיפותלמוס. הוא מגיע דרך מערכת השוער להיפופיזה הקדמית, שמפרישה בתגובה את הורמון הגדילה."}, {"id": 43, "t": "היפותלמוס ומערכת השוער", "q": "מה היתרון של מערכת השוער (portal system) בין ההיפותלמוס להיפופיזה הקדמית?", "o": ["ההורמונים מגיעים לכל הגוף במהירות לפני שהם מגיעים להיפופיזה", "ההורמונים עוברים בעצבים ישירים ולכן אינם נכנסים לדם כלל", "ההורמונים נאגרים באונה הקדמית עד שהגוף זקוק להם", "כמות קטנה של הורמון מגיעה לתאי המטרה בלי להימהל בכל הגוף"], "c": 3, "e": "מערכת השוער היא קיצור דרך בכלי דם, ישר מההיפותלמוס להיפופיזה הקדמית. ההורמון לא מתפזר בכל הגוף ולא נמהל, ולכן מספיקה כמות קטנה והשפעה מהירה."}, {"id": 44, "t": "היפותלמוס ומערכת השוער", "q": "ADH ואוקסיטוצין משתחררים מההיפופיזה האחורית. היכן הם מיוצרים?", "o": ["בקליפת בלוטת יותרת הכליה", "בתאי האונה האחורית עצמה", "בגרעינים של ההיפותלמוס", "בתאי האונה הקדמית של ההיפופיזה"], "c": 2, "e": "שני ההורמונים מיוצרים בתאים בהיפותלמוס (בגרעין הפאראוונטריקולרי). ההיפופיזה האחורית רק אוגרת אותם ומשחררת אותם לדם."}, {"id": 45, "t": "היפותלמוס ומערכת השוער", "q": "איזה צמד כולל רק הורמונים מעכבים של ההיפותלמוס?", "o": ["GHRH ו-PRH", "GHIH ו-PIH", "GnRH ו-GHIH", "CRH ו-TRH"], "c": 1, "e": "להיפותלמוס שני הורמונים מעכבים: GHIH (סומטוסטטין), שמעכב את הורמון הגדילה, ו-PIH, שמעכב את הפרולקטין. כל מה שמסתיים ב-RH הוא הורמון משחרר."}, {"id": 46, "t": "היפותלמוס ומערכת השוער", "q": "כלי הדם של מערכת השוער נחסמו, אבל העצבים שבגבעול תקינים. הפרשת איזה הורמון תיפגע?", "o": ["מלטונין מבלוטת האצטרובל", "אוקסיטוצין מהאונה האחורית", "ADH מהאונה האחורית", "ACTH מהאונה הקדמית"], "c": 3, "e": "האונה הקדמית תלויה בהורמונים המשחררים שמגיעים בכלי הדם של מערכת השוער, ולכן ACTH ייפגע. ADH ואוקסיטוצין מגיעים לאונה האחורית מההיפותלמוס בדרך אחרת ולא דרך מערכת השוער."}, {"id": 47, "t": "היפותלמוס ומערכת השוער", "q": "איזה הורמון של ההיפותלמוס גורם להיפופיזה להפריש TSH?", "o": ["CRH", "GHRH", "GnRH", "TRH"], "c": 3, "e": "TRH (הורמון משחרר תירוטרופין) מגרה את ההיפופיזה להפריש TSH, וזה מגרה את בלוטת התריס. CRH שייך לציר הקורטיזול ו-GnRH לציר הורמוני המין."}, {"id": 48, "t": "היפותלמוס ומערכת השוער", "q": "מהו ההורמון המשחרר שבראש ציר הלחץ (ציר הקורטיזול)?", "o": ["CRH", "GnRH", "TRH", "PRH"], "c": 0, "e": "CRH מההיפותלמוס מגרה הפרשת ACTH מההיפופיזה, ו-ACTH מגרה את קליפת האדרנל להפריש קורטיזול. TRH פותח את ציר התריס."}, {"id": 49, "t": "היפותלמוס ומערכת השוער", "q": "ההיפותלמוס מתואר לעתים כ'מרכז הדחק שבמוח'. מדוע?", "o": ["הוא אוגר את הורמוני הלחץ ומשחרר אותם לפי הצורך", "הוא מפריש בעצמו קורטיזול ואדרנלין לזרם הדם", "הוא מפעיל גם את המערכת האוטונומית וגם את ציר הלחץ", "הוא מעכב את פעילות ההיפופיזה בזמן מצב חירום"], "c": 2, "e": "ההיפותלמוס שולט במערכת העצבים האוטונומית ובמערכת האנדוקרינית, ולכן הוא מתזמר את תגובת הילחם או ברח. את הקורטיזול והאדרנלין מפרישה בלוטת האדרנל, לא ההיפותלמוס."}, {"id": 50, "t": "היפותלמוס ומערכת השוער", "q": "על איזה מהתהליכים הבאים אחראי ההיפותלמוס?", "o": ["שיווי משקל וקואורדינציה", "ייצור מלטונין בחושך", "עיבוד של מידע חזותי", "ויסות תחושת רעב ושובע"], "c": 3, "e": "ההיפותלמוס מווסת תהליכים מטבוליים, ובהם מרכז הרעב והשובע (שעליו משפיע גם הלפטין מרקמת השומן). שיווי משקל הוא תפקיד המוחון, ומלטונין מיוצר באצטרובל."}, {"id": 51, "t": "היפותלמוס ומערכת השוער", "q": "היכן נמצא ההיפותלמוס?", "o": ["מתחת להיפופיזה, בתוך גבעול הרקמה", "מתחת לתלמוס ומעל ההיפופיזה", "בחלק האחורי של המוח, בין ההמיספרות", "מעל התלמוס ומתחת לקליפת המוח"], "c": 1, "e": "שמו בעברית, 'תת הרמה', מרמז על מיקומו: מתחת לתלמוס. ההיפופיזה תלויה מתחתיו בגבעול. המיקום בחלק האחורי בין ההמיספרות מתאים לבלוטת האצטרובל."}, {"id": 52, "t": "היפותלמוס ומערכת השוער", "q": "רמות GnRH יורדות מאוד. אילו הורמונים צפויים לרדת בעקבות זאת?", "o": ["TSH ו-ACTH, ובהמשך גם הורמוני התריס", "FSH ו-LH, אך הורמוני המין דווקא יעלו", "פרולקטין ו-GH, ובהמשך גם הורמוני המין", "FSH ו-LH, ובהמשך גם הורמוני המין"], "c": 3, "e": "GnRH מגרה הפרשת FSH ו-LH, ואלה מגרים את הגונדות. בלי GnRH כל הציר יורד, כולל אסטרוגן, פרוגסטרון וטסטוסטרון."}, {"id": 53, "t": "היפותלמוס ומערכת השוער", "q": "אילו תאים בהיפופיזה מופעלים דרך מערכת השוער מההיפותלמוס?", "o": ["תאי שתי האונות באותה מידה", "תאי האונה הקדמית", "תאי האונה האחורית", "תאי הגבעול המחבר בלבד"], "c": 1, "e": "כל תאי האונה הקדמית מופעלים על ידי הורמונים משחררים ומעכבים שמגיעים במערכת השוער. האונה האחורית רק אוגרת הורמונים שיוצרו בהיפותלמוס."}, {"id": 54, "t": "היפותלמוס ומערכת השוער", "q": "ילד סובל מגידול שמגביר את הפרשת GHIH (סומטוסטטין) מההיפותלמוס. מה צפוי?", "o": ["הפרשת GH תרד והגדילה תואט", "הפרשת GH תעלה והגדילה תואץ", "הפרשת פרולקטין תרד וייצור החלב ייפגע", "הפרשת TSH תעלה והמטבוליזם יואץ"], "c": 0, "e": "GHIH הוא 'הורמון מעכב הורמון גדילה'. עודף שלו יוריד את הפרשת GH מההיפופיזה, ולכן גדילת הילד תואט. הפרולקטין מעוכב על ידי PIH, לא על ידי GHIH."}, {"id": 55, "t": "היפותלמוס ומערכת השוער", "q": "מה ההבדל העיקרי בין הקשר של ההיפותלמוס לאונה הקדמית לבין הקשר שלו לאונה האחורית?", "o": ["לקדמית הוא שולח הורמונים מוכנים לאגירה, לאחורית הורמונים משחררים", "לשתיהן הוא שולח הורמונים משחררים דרך מערכת השוער", "לשתיהן הוא שולח הורמונים מוכנים שנאגרים עד לשחרורם", "לקדמית הוא שולח הורמונים משחררים, לאחורית הורמונים מוכנים לאגירה"], "c": 3, "e": "לאונה הקדמית ההיפותלמוס שולח הורמונים משחררים ומעכבים, והיא מייצרת בעצמה את ההורמונים שלה. לאונה האחורית הוא שולח ADH ואוקסיטוצין מוכנים, והיא רק אוגרת ומשחררת."}, {"id": 56, "t": "היפופיזה קדמית", "q": "איזה הורמון אינו מופרש מההיפופיזה הקדמית?", "o": ["ACTH", "FSH", "אינסולין", "פרולקטין"], "c": 2, "e": "אינסולין מופרש מתאי הביתא באיי לנגרהנס בלבלב. ההיפופיזה הקדמית מפרישה GH, פרולקטין, TSH, ACTH, FSH ו-LH."}, {"id": 57, "t": "היפופיזה קדמית", "q": "איזה צמד מתאר נכון הורמון שמעודד הפרשה של הורמון אחר?", "o": ["ACTH גורם להפרשת קורטיזול", "LH גורם להפרשת אינסולין", "TSH גורם להפרשת TRH", "TSH גורם להפרשת פרולקטין"], "c": 0, "e": "ACTH מגרה את קליפת האדרנל להפריש קורטיזול. TSH מגרה את בלוטת התריס (לא פרולקטין), והכיוון הוא TRH שגורם ל-TSH ולא להפך."}, {"id": 58, "t": "היפופיזה קדמית", "q": "איזה הורמון מעודד ייצור חלב אם?", "o": ["פרוגסטרון", "אסטרוגן", "קורטיזול", "פרולקטין"], "c": 3, "e": "פרולקטין מההיפופיזה הקדמית מעודד ייצור חלב בבלוטות החלב, ויניקת התינוק מגבירה את הפרשתו. אסטרוגן ופרוגסטרון מכינים את השד (למשל צינורות החלב), אבל את הייצור עצמו מניע פרולקטין."}, {"id": 59, "t": "היפופיזה קדמית", "q": "מה מגדיר הורמון 'טרופי'?", "o": ["הורמון שמעכב את ההיפותלמוס במנגנון של משוב שלילי", "הורמון שפועל ישירות על רוב תאי הגוף ללא תיווך של בלוטה", "הורמון שיעדו בלוטה אנדוקרינית אחרת, והוא מגרה אותה להפריש", "הורמון שנאגר בהיפופיזה ומשתחרר רק במצבי לחץ"], "c": 2, "e": "הורמון טרופי 'מפעיל בלוטה': היעד שלו הוא בלוטה אנדוקרינית, שמפרישה בתגובה הורמון אחר. דוגמאות: ACTH, TSH, FSH ו-LH."}, {"id": 60, "t": "היפופיזה קדמית", "q": "איזה מההורמונים הבאים אינו הורמון טרופי?", "o": ["הורמון מצהיב (LH)", "תירוטרופין (TSH)", "קורטיקוטרופין (ACTH)", "פרולקטין (PRL)"], "c": 3, "e": "היעד של פרולקטין הוא בלוטת החלב, שמייצרת חלב ולא הורמון, ולכן הוא אינו טרופי. TSH, ACTH ו-LH מגרים בלוטות אנדוקריניות (התריס, האדרנל והגונדות)."}, {"id": 61, "t": "היפופיזה קדמית", "q": "מתי מופרש רוב הורמון הגדילה?", "o": ["אחרי ארוחה עשירה בחלבון", "בזמן פעילות גופנית מאומצת", "בלילה, בזמן שינה עמוקה", "בבוקר, מיד לאחר היקיצה"], "c": 2, "e": "כמעט מחצית מהפרשת הורמון הגדילה מתרחשת בזמן שינה עמוקה בלילה. זו אחת הסיבות לכך ששינה חשובה לגדילה של ילדים."}, {"id": 62, "t": "היפופיזה קדמית", "q": "כיצד משפיע הורמון הגדילה על רמת הגלוקוז בדם, ומדוע?", "o": ["מורידה אותה, כי הוא מגביר את הפרשת האינסולין", "מעלה אותה, כי הגוף מנצל יותר שומן וחומצות אמינו", "מורידה אותה, כי הוא מכניס גלוקוז לתאי השריר", "מעלה אותה, כי הוא מפרק גליקוגן בתאי השריר"], "c": 1, "e": "בהשפעת הורמון הגדילה הגוף מנצל יותר את מאגרי השומן וחומצות האמינו לצורכי גדילה, ולכן פחות גלוקוז נצרך ורמתו בדם עולה. הכנסת גלוקוז לתאים היא פעולת האינסולין."}, {"id": 63, "t": "היפופיזה קדמית", "q": "ילד הגיע לגובה חריג מאוד כבר בגיל צעיר. עודף של איזה הורמון יכול להסביר זאת?", "o": ["הורמון הפרולקטין", "הורמון מגרה התריס (TSH)", "הורמון ACTH", "הורמון הגדילה (GH)"], "c": 3, "e": "עודף הורמון גדילה בילדות גורם לענקות (gigantism), כי הוא ממריץ צמיחת עצמות. חוסר בו גורם לננסות."}, {"id": 64, "t": "היפופיזה קדמית", "q": "ילדה נמוכה בהרבה מאחותה הצעירה ממנה. בבירור נמצא חוסר הורמונלי. איזה חוסר הכי סביר?", "o": ["חוסר בהורמון ACTH מההיפופיזה", "חוסר בפרולקטין מההיפופיזה", "חוסר בהורמון ADH מההיפופיזה", "חוסר בהורמון GH מההיפופיזה"], "c": 3, "e": "חוסר בהורמון הגדילה בילדות פוגע בצמיחת העצמות וגורם לננסות. ACTH, פרולקטין ו-ADH אינם אחראים על גדילת עצמות."}, {"id": 65, "t": "היפופיזה קדמית", "q": "דרך איזה איבר עיקרי פועל הורמון הגדילה כדי לעודד גדילת עצמות?", "o": ["הכליה, שמפעילה ויטמין D", "הלבלב, שמפריש אינסולין", "בלוטת התריס, שמפרישה קלציטונין", "הכבד, שמפריש פקטור גדילה"], "c": 3, "e": "הורמון הגדילה פועל על תאים רבים, ובעיקר על הכבד, שמפריש פקטור גדילה. פקטור הגדילה מעודד את גדילת העצמות. הפעלת ויטמין D בכליה היא פעולה של PTH."}, {"id": 66, "t": "היפופיזה קדמית", "q": "איזו השפעה מתאימה להורמון הגדילה?", "o": ["פירוק חלבוני שריר לטובת ייצור גלוקוז", "עיכוב ריפוי פצעים ודיכוי של החיסון", "הקטנת מסת השריר והגדלת מסת השומן", "הגדלת מסת השריר והקטנת מסת השומן"], "c": 3, "e": "הורמון הגדילה מעודד סינתזת חלבונים ומונע את פירוקם, מגדיל מסת שריר ומקטין מסת שומן, מאיץ ריפוי פצעים ומגביר פעילות חיסונית. פירוק חלבונים ודיכוי חיסוני מתאימים לקורטיזול."}, {"id": 67, "t": "היפופיזה קדמית", "q": "מה תפקיד הפרולקטין אצל גברים?", "o": ["מגרה את האשכים להפריש טסטוסטרון", "מעודד התפתחות של צינורות החלב", "מסייע בייצור תאי זרע", "מעכב את הפרשת FSH מההיפופיזה"], "c": 2, "e": "אצל גברים הפרולקטין מסייע בייצור תאי זרע. את הפרשת הטסטוסטרון מגרה LH."}, {"id": 68, "t": "היפופיזה קדמית", "q": "אם מניקה מדווחת שכמות החלב ירדה אחרי שהפסיקה להניק לעתים קרובות. מה ההסבר ההורמונלי?", "o": ["פחות יניקה מובילה לפחות הפרשה של פרולקטין", "פחות יניקה מובילה ליותר הפרשה של פרולקטין", "פחות יניקה מובילה לפחות הפרשה של ACTH", "פחות יניקה מובילה ליותר הפרשה של אסטרוגן"], "c": 0, "e": "פעולת היניקה מעודדת הפרשה מוגברת של פרולקטין, שמעודד ייצור חלב. כשהיניקה פוחתת הגירוי נחלש, הפרולקטין יורד וכמות החלב יורדת."}, {"id": 69, "t": "היפופיזה קדמית", "q": "ACTH מכונה 'הורמון הדחק'. מה ההשפעה העיקרית שלו?", "o": ["מגרה את ההיפותלמוס להפריש עוד CRH", "מגרה את לשד האדרנל להפריש אדרנלין", "מגרה את קליפת האדרנל להפריש קורטיזול", "מגרה את הכבד להפריש פקטור גדילה"], "c": 2, "e": "ACTH פועל על קליפת האדרנל: מתחזק אותה ומגרה הפרשת קורטיקוסטרואידים, ובעיקר קורטיזול. הלשד מופעל על ידי המערכת הסימפתטית, לא על ידי ACTH."}, {"id": 70, "t": "היפופיזה קדמית", "q": "TSH משפיע על בלוטת התריס בשתי דרכים. מהן?", "o": ["מעכב את גדילתה ומגביר את הפרשת התירוקסין", "מגרה את גדילתה ואת הפרשת הקלציטונין", "מגרה את גדילתה ואת הפרשת התירוקסין", "מגרה את הפרשת ה-PTH ואת הפרשת התירוקסין"], "c": 2, "e": "TSH משפיע על הגדילה והתחזוקה של בלוטת התריס ועל הפרשת התירוקסין (T4), ובכך שולט בקצב חילוף החומרים. קלציטונין ו-PTH אינם בשליטת TSH."}, {"id": 71, "t": "היפופיזה קדמית", "q": "מה תפקידו של FSH באישה בתחילת המחזור החודשי?", "o": ["מעודד את הפרשת הפרוגסטרון מהגופיף הצהוב", "מעורר את הביוץ ואת היווצרות הגופיף הצהוב", "מעודד עיבוי של רירית הרחם באופן ישיר ומיידי", "מעודד התפתחות של הזקיק והפרשת אסטרוגן ממנו"], "c": 3, "e": "בתחילת המחזור FSH גורם לזקיק הראשוני להתפתח, ובהמשך להפרשת אסטרוגנים מהזקיק הבשל. את הביוץ ואת יצירת הגופיף הצהוב מעורר LH."}, {"id": 72, "t": "היפופיזה קדמית", "q": "בדיקה ביתית לחיזוי ביוץ מזהה עלייה חדה בהורמון מסוים סביב אמצע המחזור. באיזה הורמון מדובר?", "o": ["פרולקטין", "LH", "FSH", "פרוגסטרון"], "c": 1, "e": "רמת LH נמוכה בתחילת המחזור ועולה לקראת אמצעו, והעלייה הזו מעוררת את הביוץ. פרוגסטרון עולה רק אחרי הביוץ, מהגופיף הצהוב."}, {"id": 73, "t": "היפופיזה קדמית", "q": "מה תפקידו של LH בגבר?", "o": ["מגרה את האשכים לייצר טסטוסטרון", "מגרה את האדרנל לייצר טסטוסטרון", "מגרה את צינורות הזרע לייצר תאי זרע", "מגרה את ההיפותלמוס להפריש GnRH"], "c": 0, "e": "בגבר LH מעורר את תאי האשך לסנתז ולהפריש טסטוסטרון. ייצור תאי הזרע בצינורות הזרע מעודד בעיקר על ידי FSH."}, {"id": 74, "t": "היפופיזה קדמית", "q": "אחרי הביוץ, מה נוצר מהזקיק שנשאר בשחלה בהשפעת LH, ומה הוא מפריש?", "o": ["זקיק ראשוני, שמפריש פרוגסטרון ואסטרוגן", "שליה, שמפרישה פרוגסטרון ואסטרוגן", "גופיף צהוב, שמפריש FSH ו-LH", "גופיף צהוב, שמפריש פרוגסטרון ואסטרוגן"], "c": 3, "e": "בהשפעת LH, הזקיק שנשאר אחרי הביוץ הופך לגופיף הצהוב, שמפריש פרוגסטרון ואסטרוגן. FSH ו-LH מופרשים מההיפופיזה, והשליה נוצרת רק בהריון."}, {"id": 75, "t": "היפופיזה קדמית", "q": "גידול בהיפופיזה הקדמית מפריש ACTH ביתר. איזה ממצא צפוי?", "o": ["אדרנלין גבוה ללא שינוי בקורטיזול", "אלדוסטרון נמוך ולחץ דם נמוך", "קורטיזול נמוך והקטנה של בלוטות האדרנל", "קורטיזול גבוה והגדלה של בלוטות האדרנל"], "c": 3, "e": "עודף ACTH מגרה את קליפת האדרנל לגדול ולהפריש יותר קורטיקוסטרואידים. זה אחד הגורמים הפנימיים לתסמונת קושינג."}, {"id": 76, "t": "היפופיזה קדמית", "q": "מה משותף לכל ההורמונים של האונה הקדמית?", "o": ["כולם אינם סטרואידים ומווסתים במשוב חיובי", "כולם סטרואידים ומווסתים במשוב שלילי", "כולם נוצרים בהיפותלמוס ונאגרים באונה", "כולם אינם סטרואידים ומווסתים במשוב שלילי"], "c": 3, "e": "הורמוני ההיפופיזה אינם סטרואידים, והם מופעלים דרך מערכת השוער ומווסתים במשוב שלילי ששומר על הומיאוסטזיס. הורמונים שנוצרים בהיפותלמוס ונאגרים הם אלה של האונה האחורית."}, {"id": 77, "t": "היפופיזה קדמית", "q": "מה עיקר תפקידו של הורמון הגדילה אחרי גיל הילדות?", "o": ["גירוי בלוטת התריס להפריש תירוקסין", "שמירה על מסת הגוף ועל קצב מטבולי קבוע", "המשך הארכה של עצמות הגפיים לאורך החיים", "הפעלת הביוץ והבשלת הזקיקים בשחלה"], "c": 1, "e": "בילדות הורמון הגדילה ממריץ צמיחת עצמות. אחרי הילדות תפקידו לשמור על מסת הגוף ועל קצב מטבולי קבוע, והפרשתו פוחתת בהדרגה עם הגיל."}, {"id": 78, "t": "היפופיזה קדמית", "q": "מה תפקידו של FSH בגבר?", "o": ["מגרה את הפרשת הטסטוסטרון מהאשכים", "מפעיל ויטמין D בכליות לספיגת סידן", "חיוני ליצירת תאי זרע באבוביות הזרע", "מגרה את הפרשת הפרולקטין מההיפופיזה"], "c": 2, "e": "בגבר FSH מעודד את התפתחות צינורות הזרע וחיוני ליצירת תאי זרע. את הפרשת הטסטוסטרון מגרה LH."}, {"id": 79, "t": "היפופיזה קדמית", "q": "מדוע פגיעה בהיפופיזה הקדמית יכולה לגרום לתת-פעילות של כמה בלוטות בבת אחת?", "o": ["כי היא אוגרת הורמונים שמיוצרים בבלוטות האחרות", "כי היא מפרישה הורמונים טרופיים לכמה בלוטות מטרה", "כי היא מקבלת עצבוב ישיר מכל הבלוטות בגוף", "כי היא מפרישה בעצמה את ההורמונים של כל הבלוטות"], "c": 1, "e": "ההיפופיזה הקדמית מפרישה TSH, ACTH, FSH ו-LH, שמגרים את התריס, האדרנל והגונדות. בלי ההורמונים הטרופיים, כל הבלוטות האלה יפרישו פחות."}, {"id": 80, "t": "היפופיזה אחורית", "q": "איפה יפעל ADH במצב של התייבשות?", "o": ["בלולאת הנלה ובגלומרולוס", "באבובית המקורבת ובלולאת הנלה", "באבובית המקורבת ובגלומרולוס", "באבובית המרוחקת ובצינור המאסף"], "c": 3, "e": "ADH פועל על החלק האחרון של הנפרון, האבובית המרוחקת והצינור המאסף, ומגביר שם את ספיגת המים חזרה לדם. בגלומרולוס מתרחש סינון, לא ספיגה חוזרת."}, {"id": 81, "t": "היפופיזה אחורית", "q": "מה ההשפעה של ADH?", "o": ["כשלחץ הדם עולה, הוא מגביר את הספיגה החוזרת של נתרן ואשלגן", "כשהאוסמולריות בדם יורדת, הוא מגביר ספיגה חוזרת בצינור הדיסטלי והמאסף", "כשהאוסמולריות בדם עולה, הוא מגביר ספיגה חוזרת בצינור הדיסטלי והמאסף", "כשלחץ הדם עולה, הוא מגביר ספיגה חוזרת בצינור הדיסטלי והמאסף"], "c": 2, "e": "כשהדם מרוכז מדי (אוסמולריות גבוהה), ADH מופרש וגורם לכליה להחזיר יותר מים לדם, וכך הדם נמהל. דם מדולל ולחץ דם גבוה הם מצבים שבהם ADH דווקא יורד."}, {"id": 82, "t": "היפופיזה אחורית", "q": "מדוע ADH נקרא גם וזופרסין?", "o": ["כי הוא מגביר את הפרשת הנתרן והמים בשתן", "כי הוא מגביר את קצב הלב ואת תפוקת הלב", "כי הוא מכווץ שריר חלק בעורקים ומעלה לחץ דם", "כי הוא מרחיב את כלי הדם ומוריד את לחץ הדם"], "c": 2, "e": "מלבד שמירת המים בכליה, ADH מכווץ את השרירים החלקים בעורקים ושומר על לחץ הדם. מכאן השם וזופרסין: 'לוחץ על כלי הדם'."}, {"id": 83, "t": "היפופיזה אחורית", "q": "אדם שותה מעט מאוד מים ביום חם. כיצד ישתנו ADH והשתן?", "o": ["ADH ירד, והשתן יהיה מועט ומרוכז", "ADH יעלה, והשתן יהיה מועט ומרוכז", "ADH יעלה, והשתן יהיה רב ומדולל", "ADH י  לדם. מערכת השוער והורמונים טרופיים שייכים לאונה הקדמית."}, {"id": 89, "t": "היפופיזה אחורית", "q": "איזה צמד הורמונים משתחרר מאותה אונה של ההיפופיזה?", "o": ["ADH ופרולקטין", "אוקסיטוצין ו-LH", "TSH ואוקסיטוצין", "ADH ואוקסיטוצין"], "c": 3, "e": "ADH ואוקסיטוצין הם שני ההורמונים של האונה האחורית. פרולקטין, LH ו-TSH מופרשים מהאונה הקדמית."}, {"id": 90, "t": "היפופיזה אחורית", "q": "מה משותף ל-ADH ולאלדוסטרון?", "o": ["שניהם משתחררים מההיפופיזה האחורית", "שניהם מגבירים את החזרת המים מהכליה לדם", "שניהם הורמונים סטרואידים מקליפת האדרנל", "שניהם מגבירים את נפח השתן המופרש"], "c": 1, "e": "ADH מגביר ספיגת מים בצינור המאסף, ואלדוסטרון מגביר ספיגת נתרן שגוררת איתה מים. שניהם מקטינים את נפח השתן ותומכים בנפח הדם. רק אלדוסטרון הוא סטרואיד מהאדרנל."}, {"id": 91, "t": "היפופיזה אחורית", "q": "תינוק מתחיל לינוק, ותוך זמן קצר החלב מתחיל לזרום. איזה הורמון מתווך את הפרשת החלב ברגע ההנקה?", "o": ["אוקסיטוצין", "הורמון LH", "פרולקטין", "אסטרוגן"], "c": 0, "e": "אוקסיטוצין מקדם את הפרשת החלב בזמן ההנקה. פרולקטין אחראי על ייצור החלב, כלומר על 'מילוי המלאי', ולא על ההפרשה ברגע היניקה."}, {"id": 92, "t": "אצטרובל ותימוס", "q": "שמעון עובד כנהג בלילות וישן בימים. פעילות של איזו בלוטה תיפגע?", "o": ["בלוטת האדרנל", "בלוטת האצטרובל", "בלוטת התריס", "בלוטת ההיפופיזה"], "c": 1, "e": "בלוטת האצטרובל מפרישה מלטונין לפי מחזור האור והחושך, ומשמשת כשעון הביולוגי. עבודת לילה ושינה ביום משבשות את הקצב הזה."}, {"id": 93, "t": "אצטרובל ותימוס", "q": "מתי עולה רמת המלטונין בדם?", "o": ["כשאור השמש נעדר, והוא משמש טריגר לשינה", "כשאור השמש חזק, והוא משמש טריגר ליקיצה", "בזמן לחץ, והוא משמש טריגר לדריכות", "אחרי ארוחה, והוא משמש טריגר לעיכול"], "c": 0, "e": "רמת המלטונין עולה בחושך, וזה הטריגר לשינה. לכן הוא ממלא תפקיד מרכזי בשעון הביולוגי."}, {"id": 94, "t": "אצטרובל ותימוס", "q": "מה התפקיד העיקרי של בלוטת האצטרובל?", "o": ["ויסות של רמת הסידן בדם בזמן השינה", "תיווך בין ההיפותלמוס לבין האונה הקדמית", "תיווך בין גירויים עצביים להפרשה של מלטונין", "ייצור של לימפוציטים מסוג T בשנות הילדות"], "c": 2, " , "פגיעה בבלוטת התריס, חוסר T3/T4 ודופק מהיר"], "c": 2, "e": "בלוטות יותרת התריס יושבות צמוד לבלוטת התריס ועלולות להיפגע בניתוח. בלי PTH הסידן יורד, ומופיעה כווצת: התכווצויות שרירים בעיקר בפנים ובגפיים."}, {"id": 126, "t": "משק הסידן", "q": "מהי כווצת (tetany), ומה גורם לה?", "o": ["חולשת שרירים, בגלל רמת אשלגן נמוכה בדם", "חולשת שרירים, בגלל רמת סידן גבוהה בדם", "התכווצויות שרירים, בגלל רמת סידן גבוהה בדם", "התכווצויות שרירים, בגלל רמת סידן נמוכה בדם"], "c": 3, "e": "כווצת היא התכווצויות שרירים לא רצוניות שנובעות מסידן נמוך בדם, למשל בתת-פעילות של יותרת התריס. סידן גבוה נוטה לגרום דווקא לעייפות ולחולשה."}, {"id": 127, "t": "משק הסידן", "q": "מטופלת עם יתר פעילות של יותרת התריס. איזה צירוף ממצאים מתאים?", "o": ["סידן גבוה בדם, כווצת ופרכוסים", "סידן נמוך בדם, כווצת ופרכוסים", "סידן נמוך בדם, אבנים בכליות ודלדול עצם", "סידן גבוה בדם, אבנים בכליות ודלדול עצם"], "c": 3, "e": "עודף PTH מוציא סידן מהעצמות (דלדול עצם) ומעלה את הסידן בדם, והעודף עלול לשקוע כאבנים בכליות. כווצת ופרכוסים אופייניים לסידן נמוך."}, {"id": 128, "t": "משק הסידן", "q": "מה אופייני להופעה הקלינית של יתר פעילות של יותרת התריס ברוב המקרים?", "o": ["לרוב היא מתבטאת בירידה חדה בלחץ הדם", "לרוב היא מופיעה בהתקף חריף של פרכוסים", "לרוב אין תסמינים, או רק עייפות והרגשה רעה", "לרוב היא מתגלה בגלל בליטת גלגלי העיניים"], "c": 2, "e": "ברוב המקרים המחלה א-סימפטומטית, ולכל היותר יש עייפות, דיכאון והרגשה כללית רעה. פרכוסים שייכים לסידן נמוך, ובליטת עיניים לגרייבס."}, {"id": 129, "t": "משק הסידן", "q": "מדוע אוסטאופורוזיס שכיחה יותר בנשים אחרי גיל המעבר?", "o": ["עליית הקלציטונין חוסמת את בניית העצם על ידי האוסטאובלסטים", "עליית האסטרוגן מגבירה את הרס העצם על ידי האוסטאוקלסטים", "ירידת האסטרוגן פוגעת באיזון בין בניית העצם להרס שלה", "ירידת ה-PTH מונעת שחרור של סידן מהעצם אל הדם"], "c": 2, "e": "האסטרוגן הוא אחד המווסתים של תהליכי הבנייה וההרס בעצם. אחרי גיל המעבר הוא יורד, האיזון מופר לטובת ההרס, ודחיסות העצם יורדת."}, {"id": 130, "t": "משק הסידן", "q": "אילו תאים בונים עצם, ואילו הורסים עצם?", "o": ["אוסטאובלסט function curId(){return S.queue[0]}
function reshuffleFor(id){
  const q=QS[id];const prevPos=S.perm[id].indexOf(q.c);
  let p,tries=0;
  do{p=shuffle([0,1,2,3]);tries++}while(p.indexOf(q.c)===prevPos&&tries<50);
  S.perm[id]=p;
}
function requeue(id){
  S.queue.shift();
  const n=S.queue.length;
  if(n<3){S.queue.push(id)}
  else{const k=3+Math.floor(Math.random()*Math.min(4,n-2));S.queue.splice(Math.min(k,n),0,id)}
  reshuffleFor(id);
}

/* ---------- views ---------- */
function ring(){
  const tot=S?S.ids.length:0, m=S?S.mastered.length:0;
  const r=36,C=2*Math.PI*r,off=C*(1-(tot?m/tot:0));
  return `<div class="ring" aria-label="שאלות שנשלטו: ${m} מתוך ${tot}">
  <svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--loop-track)" stroke-width="8"/>
  <circle class="p" cx="42" cy="42" r="${r}" fill="none" stroke="var(--loop)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
  <div class="num"><b>${m}</b><span>מתוך ${tot}</span></div></div>`;
}
function header(){
  const inQ=S?S.queue.length:0;
  const firstAns=S?Object.keys(S.first).length:0, firstOk=S?Object.values(S.first).filter(Boolean).length:0;
  return `<header>${ring()}<div class="hstats"><h1>המערכת האנדוקרינית</h1>
  <p>בתור: <strong>${inQ}</strong> &nbsp; נכון בניסיון ראשון: <strong>${firstOk}/${firstAns}</strong></p></div></header>`;
}

function renderStart(){
  const saved=load();
  const canResume=saved&&!saved.done&&saved.queue&&saved.queue.length;
  const counts={};QS.forEach(q=>counts[q.t]=(counts[q.t]||0)+1);
  app.innerHTML=`<header>${'<div class="hstats"><h1>המערכת האנדוקרינית</h1><p>200 שאלות לפי ההרצאה והשחזורים. שאלה שטעית בה או דילגת עליה חוזרת בהמשך, עד שתענה עליה נכון.</p></div>'}</header>
  ${canResume?`<div class="card" style="margin-bottom:14px"><h2>יש התקדמות שמורה</h2>
   <p class="muted">נשלטו ${saved.mastered.length} מתוך ${saved.ids.length}, ${saved.queue.length} עדיין בתור.</p>
   <div class="row"><button class="btn" id="resume">להמשיך מאיפה שעצרתי</button></div></div>`:""}
  <div class="card"><h2>אילו נושאים?</h2>
   <div class="topics">${topicsAll.map((t,i)=>`<label class="chk"><input type="checkbox" value="${i}" checked> ${t}<span class="c">${counts[t]}</span></label>`).join("")}</div>
   <label class="chk" style="margin-bottom:16px"><input type="checkbox" id="rnd" checked> לערבב את סדר השאלות</label>
   <div class="row"><button class="btn" id="go">להתחיל מבחן חדש</button>
   <button class="btn ghost" id="none">לנקות בחירה</button></div>
   <p class="hint" style="margin-top:12px">מקשים: 1 עד 4 לבחירה, Enter לשאלה הבאה, S לדילוג.</p></div>`;
  if(canResume)document.getElementById("resume").onclick=()=>{S=saved;render()};
  document.getElementById("none").onclick=()=>{
    const boxes=[...app.querySelectorAll(".topics input")];const any=boxes.some(b=>b.checked);
    boxes.forEach(b=>b.checked=!any);document.getElementById("none").textContent=any?"לבחור הכול":"לנקות בחירה";};
  document.getElementById("go").onclick=()=>{
    const sel=[...app.querySelectorAll(".topics input:checked")].map(b=>topicsAll[+b.value]);
    if(!sel.length){alert("צריך לבחור לפחות נושא אחד.");return}
    const ids=QS.filter(q=>sel.includes(q.t)).map(q=>q.id);
    newSession(ids,document.getElementById("rnd").checked);
  };
}

let answered=false, autoT=null;
function renderQuestion(){
  answered=false;
  const id=curId(),q=QS[id],perm=S.perm[id];
  const again=S.tries[id]>0||S.seen[id];
  app.innerHTML=header()+`<div class="card">
   <span class="topic">${q.t}</span>${again?'<span class="again">שאלה חוזרת</span>':""}
   <p class="qtext">${esc(q.q)}</p>
   <div class="opts">${perm.map((oi,k)=>`<button class="opt" data-oi="${oi}"><span class="l">${LETTERS[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div>
   <div class="fb" id="fb"></div>
   <div class="actions"><button class="btn ghost" id="skip">דילוג</button>
   <span class="hint" id="h"></span><button class="btn" id="next" disabled>הבאה</button></div></div>
   <p class="hint" style="margin-top:14px;text-align:center"><a href="#" id="quit" style="color:var(--muted)">לסיים ולראות סיכום</a></p>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  document.getElementById("skip").onclick=skip;
  document.getElementById("next").onclick=next;
  document.getElementById("quit").onclick=e=>{e.preventDefault();S.done=true;save();render()};
}
function choose(oi){
  if(answered)return;answered=true;
  const id=curId(),q=QS[id],right=oi===q.c;
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach(b=>{b.disabled=true;const v=+b.dataset.oi;
    if(v===q.c)b.classList.add("ok");else if(v===oi)b.classList.add("bad");else b.classList.add("dim")});
  S.seen[id]=true;
  if(!(id in S.first))S.first[id]=right;
  const fb=document.getElementById("fb");
  document.getElementById("skip").disabled=true;
  const nx=document.getElementById("next");nx.disabled=false;
  if(right){
    S.mastered.push(id);S.queue.shift();
    fb.className="fb show good";fb.textContent="נכון!";
    save();nx.focus();
    autoT=setTimeout(next,1100);
  }else{
    S.tries[id]=(S.tries[id]||0)+1;
    fb.className="fb show wrong";
    fb.innerHTML=`<h3>לא נכון. התשובה הנכונה מסומנת בירוק.</h3><p>${esc(q.e)}</p>`;
    document.getElementById("h").textContent="השאלה תחזור בהמשך";
    requeue(id);save();nx.focus();
  }
  updateHeader();
}
function skip(){
  if(answered)return;
  const id=curId();
  if(!(id in S.first))S.first[id]=false;
  S.tries[id]=(S.tries[id]||0)+1;S.seen[id]=true;
  requeue(id);save();render();
}
function next(){clearTimeout(autoT);if(!S.queue.length)S.done=true;save();render()}
function updateHeader(){const h=app.querySelector("header");if(h)h.outerHTML=header()}

function renderEnd(){
  const ids=S.ids, answeredIds=ids.filter(id=>id in S.first);
  const ok=answeredIds.filter(id=>S.first[id]).length;
  const multi=ids.filter(id=>S.first[id]===false);
  const byT={};
  answeredIds.forEach(id=>{const t=QS[id].t;byT[t]=byT[t]||{n:0,ok:0};byT[t].n++;if(S.first[id])byT[t].ok++});
  const weak=Object.entries(byT).map(([t,v])=>({t,p:v.ok/v.n,n:v.n,ok:v.ok})).filter(x=>x.p<0.8).sort((a,b)=>a.p-b.p);
  const pct=answeredIds.length?Math.round(100*ok/answeredIds.length):0;
  const finished=!S.queue.length;
  app.innerHTML=header()+`<div class="card">
   <h2>${finished?"סיימת את כל השאלות":"סיכום ביניים"}</h2>
   <div class="big">${pct}%</div>
   <p class="muted">נכון בניסיון הראשון: ${ok} מתוך ${answeredIds.length} שאלות שנענו${finished?"":` (${S.queue.length} עדיין בתור)`}.</p>
   <div class="section"><h2>נושאים לחזרה</h2>
   ${weak.length?`<ul class="list">${weak.map(w=>`<li>${w.t} <span class="n">${w.ok}/${w.n} נכון בניסיון ראשון</span><div class="bar"><i style="width:${Math.round(100*(1-w.p))}%"></i></div></li>`).join("")}</ul>`:'<p class="muted">אין נושא מתחת ל-80% בניסיון הראשון.</p>'}</div>
   <div class="section"><h2>שאלות שדרשו יותר מניסיון אחד (${multi.length})</h2>
   ${multi.length?`<ul class="list">${multi.map(id=>`<li>${esc(QS[id].q)} <span class="n">${QS[id].t}, ${S.tries[id]||1} ניסיונות שגויים או דילוגים</span></li>`).join("")}</ul>`:'<p class="muted">כל השאלות נענו נכון בפעם הראשונה.</p>'}</div>
   <div class="row section">
    ${multi.length?'<button class="btn" id="redo">לתרגל שוב רק את השאלות האלה</button>':""}
    ${!finished?'<button class="btn ghost" id="back">לחזור לשאלות</button>':""}
    <button class="btn ghost" id="restart">מבחן חדש</button></div></div>`;
  const r=document.getElementById("redo");if(r)r.onclick=()=>newSession(multi,true);
  const b=document.getElementById("back");if(b)b.onclick=()=>{S.done=false;save();render()};
  document.getElementById("restart").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=null;render()};
}

function render(){
  window.scrollTo(0,0);
  if(!S)return renderStart();
  if(S.done||!S.queue.length)return renderEnd();
  renderQuestion();
}
document.addEventListener("keydown",e=>{
  if(!S||S.done||!S.queue.length)return;
  if(!answered&&e.key>="1"&&e.key<="4"){const b=app.querySelectorAll(".opt")[+e.key-1];if(b)b.click()}
  else if(e.key==="Enter"&&answered){e.preventDefault();next()}
  else if((e.key==="s"||e.key==="S"||e.key==="ד")&&!answered)skip();
});
const app=document.getElementById("app");
render();
</script>
</body>
</html>
